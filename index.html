<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トレカアンテナ | トレーディングカードの相場・新弾・買取・攻略情報</title>
<meta name="description" content="トレーディングカードの相場動向、新弾情報、買取の考え方、初心者向けガイドなどをまとめる情報ブログ「トレカアンテナ」。">
<link rel="stylesheet" href="./assets/style.css">
<link rel="alternate" type="application/rss+xml" title="トレカアンテナ RSS" href="./feed.xml">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PGBR3HY40L"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-PGBR3HY40L');
</script>
</head>
<body>
<header class="site-header">
  <div class="inner">
    <div>
      <div class="brand">トレカ<span>アンテナ</span></div>
      <div class="tagline">相場・新弾・買取・攻略 ― トレカ情報のアンテナを張る</div>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <h1>最新の記事</h1>
    <p>トレーディングカードにまつわる相場・新弾・買取・保管・初心者ガイドなどを毎日更新しています。</p>
  </div>

  <div class="list-controls">
    <div class="filters" id="filters"></div>
    <div class="sort-bar" id="sort-bar" role="group" aria-label="並び替え">
      <span class="sort-label">並び替え</span>
      <button type="button" class="sort-chip active" data-sort="new" aria-pressed="true">新着</button>
      <button type="button" class="sort-chip" data-sort="popular" aria-pressed="false">人気</button>
    </div>
  </div>
  <div class="post-list" id="post-list">
    <p style="color:var(--text-muted)">記事を読み込み中です…</p>
  </div>
</main>

<footer class="site-footer">
  トレカアンテナ ― トレーディングカード情報ブログ
</footer>

<script>
const THEME_LABELS = {
  souba: "相場・高騰",
  shinpan: "新弾・収録カード",
  kaitori: "買取・売却の考え方",
  guide: "初心者ガイド・デッキ",
  kanbetsu: "真贋・保管",
  column: "コラム・イベント"
};

async function main(){
  const listEl = document.getElementById('post-list');
  const filtersEl = document.getElementById('filters');
  let posts = [];
  try{
    const res = await fetch('./data/posts.json', {cache:'no-store'});
    posts = await res.json();
  }catch(e){
    listEl.innerHTML = '<p>記事データの読み込みに失敗しました。</p>';
    return;
  }

  // posts.json の並び(=追加された順)を保持しておく。同じ日付の記事はこれで新旧を判定する。
  posts.forEach((p,i)=>{ p._seq = i; });

  const SORTS = {
    // 新着: 日付の新しい順。同日なら後から追加されたものが上。
    new: (a,b)=> (b.date||'').localeCompare(a.date||'') || b._seq - a._seq,
    // 人気: 品質スコアの高い順。同点なら新着順にフォールバックする。
    popular: (a,b)=> (b.qualityScore ?? -1) - (a.qualityScore ?? -1)
                     || (b.date||'').localeCompare(a.date||'')
                     || b._seq - a._seq
  };

  if(posts.length === 0){
    listEl.innerHTML = '<p style="color:var(--text-muted)">まだ記事がありません。まもなく最初の記事が公開されます。</p>';
    return;
  }

  const themesPresent = [...new Set(posts.map(p=>p.theme))];
  filtersEl.innerHTML = ['all', ...themesPresent].map(t =>
    `<button class="filter-chip${t==='all' ? ' active' : ''}" data-theme="${t}">${t==='all' ? 'すべて' : (THEME_LABELS[t]||t)}</button>`
  ).join('');

  let currentTheme = 'all';
  let currentSort = 'new';

  function render(){
    const filtered = (currentTheme === 'all' ? posts : posts.filter(p=>p.theme===currentTheme))
      .slice()
      .sort(SORTS[currentSort]);
    listEl.innerHTML = filtered.map(p => `
      <article class="post-card">
        <div class="post-meta">
          <span class="tag">${THEME_LABELS[p.theme] || p.theme}</span>
          <span>${p.date || ''}</span>
          ${typeof p.qualityScore === 'number' ? `<span class="score">品質スコア ${p.qualityScore}/100</span>` : ''}
        </div>
        <h2><a href="./posts/${p.slug}.html">${p.title}</a></h2>
        <p class="excerpt">${p.excerpt || ''}</p>
      </article>
    `).join('');
  }

  render();

  filtersEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('.filter-chip');
    if(!btn) return;
    filtersEl.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTheme = btn.dataset.theme;
    render();
  });

  const sortEl = document.getElementById('sort-bar');
  sortEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('.sort-chip');
    if(!btn || !SORTS[btn.dataset.sort]) return;
    sortEl.querySelectorAll('.sort-chip').forEach(b=>{
      b.classList.remove('active');
      b.setAttribute('aria-pressed','false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed','true');
    currentSort = btn.dataset.sort;
    render();
  });
}
main();
</script>
</body>
</html>
